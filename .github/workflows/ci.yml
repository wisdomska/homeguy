name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ---- 1. typecheck --------------------------------------------------
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # ---- 2. lint -------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Includes the no-hex-literals rule: colour lives in tokens.css.
      - run: npm run lint

  # ---- 3. unit tests -------------------------------------------------
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Includes: totalToMoveIn is null when the advance is null; the grep
      # for defaults in the advance path; the white-on-clay contrast check;
      # and the scarcity-language check.
      - run: npm test

  # ---- 4. bundle size ------------------------------------------------
  bundle:
    name: Bundle size
    runs-on: ubuntu-latest
    # The budget comment is written back to the PR.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # Fails on regression past the budget in scripts/bundle-check.mjs:
      # 120 KB gzipped JS on /search, 400 KB total first page, 5 KB analytics.
      - run: npm run bundle
      - name: Comment budget on the PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('bundle-report.md', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  # ---- 5. E2E + axe --------------------------------------------------
  e2e:
    name: E2E and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Prefer the Vercel preview for this PR when one exists, so the tests
      # run against the artefact that would ship. Falls back to a local
      # build otherwise.
      - name: Wait for the Vercel preview
        if: github.event_name == 'pull_request'
        id: preview
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.2
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 600

      - name: Run Playwright
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.preview.outputs.url }}
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ---- the gate ------------------------------------------------------
  # Branch protection requires this one job, so adding a check above does
  # not mean remembering to update the protection rule.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test, bundle, e2e]
    if: always()
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All five checks passed."
